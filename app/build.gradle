plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'id.nizx.wabotpoc'
    compileSdk 34

    def ndkEnv = System.getenv('NDK_VERSION')
    if (ndkEnv) {
        ndkVersion ndkEnv
    }

    def buildNumber = System.getenv('GITHUB_RUN_NUMBER') ?: "1"
    def appVersionCode = buildNumber.toInteger()

    defaultConfig {
        applicationId 'id.nizx.wabotpoc'
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName "0.0.${appVersionCode}"

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "release-keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libnode/bin/']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
