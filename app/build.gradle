plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'id.nizx.wabotpoc'
    compileSdk 34

    def ndkEnv = System.getenv('NDK_VERSION')
    if (ndkEnv) {
        ndkVersion ndkEnv
    }

    defaultConfig {
        applicationId 'id.nizx.wabotpoc'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.0.1-poc'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libnode/bin/']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
