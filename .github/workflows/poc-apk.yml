name: Build PoC APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      nodejs_mobile_tag:
        description: 'Tag rilis nodejs-mobile'
        default: 'v18.17.2'
      baileys_version:
        description: 'Versi Baileys dari npm'
        default: '6.7'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/release-keystore.jks"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/app/release-keystore.jks" >> "$GITHUB_ENV"

      - name: Unduh nodejs-mobile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NODE_TAG="${{ inputs.nodejs_mobile_tag || 'v18.17.2' }}"
          mkdir -p /tmp/nm && cd /tmp/nm
          gh release download "$NODE_TAG" --repo nodejs-mobile/nodejs-mobile --pattern '*android*'
          for f in *.zip; do unzip -q "$f"; done
          LIB=$(find /tmp/nm -path '*arm64-v8a*' -name libnode.so | head -n1)
          if [ -z "$LIB" ]; then
            echo "libnode.so arm64-v8a tidak ditemukan"
            find /tmp/nm | head -60
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/app/libnode/bin/arm64-v8a"
          cp "$LIB" "$GITHUB_WORKSPACE/app/libnode/bin/arm64-v8a/libnode.so"

      - name: Siapkan proyek Node
        run: |
          set -e
          BAILEYS_VERSION="${{ inputs.baileys_version || '6.7' }}"
          mkdir -p "$RUNNER_TEMP/njs"
          cp poc/nodejs-project/main.js "$RUNNER_TEMP/njs/"
          cd "$RUNNER_TEMP/njs"
          npm init -y > /dev/null
          npm install --omit=dev --no-audit --no-fund "@whiskeysockets/baileys@$BAILEYS_VERSION"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets"
          zip -qr "$GITHUB_WORKSPACE/app/src/main/assets/nodejs-project.zip" .

      - name: Versi NDK
        run: echo "NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Buat release otomatis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk nizx-poc.apk
          ls -lh nizx-poc.apk
          TAG="poc-${{ github.run_number }}"
          gh release create "$TAG" nizx-poc.apk --prerelease \
            --title "PoC #${{ github.run_number }}" \
            --notes "Node: ${{ inputs.nodejs_mobile_tag || 'v18.17.2' }} | Baileys: ${{ inputs.baileys_version || '6.7' }}"
