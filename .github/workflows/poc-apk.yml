name: Build PoC APK

on:
  workflow_dispatch:
    inputs:
      nodejs_mobile_tag:
        description: 'Tag rilis nodejs-mobile'
        default: 'v18.17.2'
      baileys_version:
        description: 'Versi Baileys dari npm'
        default: '6.7'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unduh nodejs-mobile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/nm && cd /tmp/nm
          gh release download "${{ inputs.nodejs_mobile_tag }}" --repo nodejs-mobile/nodejs-mobile --pattern '*android*'
          ls -la
          for f in *.zip; do unzip -q "$f"; done
          LIB=$(find /tmp/nm -path '*arm64-v8a*' -name libnode.so | head -n1)
          if [ -z "$LIB" ]; then echo "libnode.so arm64-v8a tidak ditemukan"; find /tmp/nm | head -60; exit 1; fi
          mkdir -p "$GITHUB_WORKSPACE/app/libnode/bin/arm64-v8a"
          cp "$LIB" "$GITHUB_WORKSPACE/app/libnode/bin/arm64-v8a/libnode.so"
          ls -lh "$GITHUB_WORKSPACE/app/libnode/bin/arm64-v8a/"
          (readelf -d "$LIB" | grep -E 'NEEDED|SONAME') || true

      - name: Siapkan proyek Node
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/njs"
          cp poc/nodejs-project/main.js "$RUNNER_TEMP/njs/"
          cd "$RUNNER_TEMP/njs"
          npm init -y > /dev/null
          npm install --omit=dev --no-audit --no-fund "@whiskeysockets/baileys@${{ inputs.baileys_version }}"
          npm ls @whiskeysockets/baileys --depth=0
          du -sh node_modules
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets"
          zip -qr "$GITHUB_WORKSPACE/app/src/main/assets/nodejs-project.zip" .
          ls -lh "$GITHUB_WORKSPACE/app/src/main/assets/nodejs-project.zip"

      - name: Versi NDK
        run: echo "NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk nizx-poc.apk
          ls -lh nizx-poc.apk
          gh release create "poc-${{ github.run_number }}" nizx-poc.apk --prerelease \
            --title "PoC #${{ github.run_number }}" \
            --notes "Node: ${{ inputs.nodejs_mobile_tag }} | Baileys: ${{ inputs.baileys_version }}"
